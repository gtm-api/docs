    RetryMassActionItemsRequest:
      type: object
      description: Request body of `retry_mass_action_items`.
      properties:
        sid:
          type: string
          minLength: 18
          maxLength: 18
          pattern: ^ma_im_
          description: Single-item mode. Mutually exclusive with filter.
        filter:
          type: object
          properties:
            sid:
              type: object
              properties:
                eq:
                  type: string
                in:
                  type: array
                  items:
                    type: string
              additionalProperties: false
            team_sid:
              type: object
              properties:
                eq:
                  type: string
              additionalProperties: false
              description: "Redundant in normal use: the backend already scopes every read to the caller's team."
            mass_action_sid:
              type: object
              properties:
                eq:
                  type: string
                in:
                  type: array
                  items:
                    type: string
              additionalProperties: false
              description: The parent run (ma_ac_…). The drill-down filter, start here.
            object_sid:
              type: object
              properties:
                eq:
                  type: string
                in:
                  type: array
                  items:
                    type: string
              additionalProperties: false
              description: 'Cursor sid, parent-scoped by contract: always pair it with mass_action_sid. "Which runs ever touched object X" is not a supported query (the contract reserves 422 bounded_scan_required for it); the index is (mass_action_sid, object_sid), so on its own it is a full team scan.'
            status:
              type: object
              properties:
                eq:
                  type: string
                  enum:
                    - pending
                    - queued
                    - running
                    - succeeded
                    - failed
                    - skipped
                    - cancelled
                ne:
                  type: string
                  enum:
                    - pending
                    - queued
                    - running
                    - succeeded
                    - failed
                    - skipped
                    - cancelled
                in:
                  type: array
                  items:
                    type: string
                    enum:
                      - pending
                      - queued
                      - running
                      - succeeded
                      - failed
                      - skipped
                      - cancelled
                nin:
                  type: array
                  items:
                    type: string
                    enum:
                      - pending
                      - queued
                      - running
                      - succeeded
                      - failed
                      - skipped
                      - cancelled
              additionalProperties: false
            current_step:
              type: object
              properties:
                eq:
                  type: integer
                gte:
                  type: integer
                lte:
                  type: integer
                gt:
                  type: integer
                lt:
                  type: integer
              additionalProperties: false
              description: 'Which plan step the row sits on: "everyone stuck at step 2".'
            wait_reason:
              type: object
              properties:
                eq:
                  type: string
                  enum:
                    - task_pending
                is_null:
                  type: boolean
              additionalProperties: false
              description: eq:'task_pending' selects the items deferred on an async task.
            retry_count:
              type: object
              properties:
                eq:
                  type: integer
                gte:
                  type: integer
                lte:
                  type: integer
                gt:
                  type: integer
                lt:
                  type: integer
              additionalProperties: false
            scheduled_at:
              type: object
              properties:
                gte:
                  type: string
                lte:
                  type: string
                gt:
                  type: string
                lt:
                  type: string
                is_null:
                  type: boolean
              additionalProperties: false
              description: "Due horizon: what runs next and when."
            started_at:
              type: object
              properties:
                gte:
                  type: string
                lte:
                  type: string
                gt:
                  type: string
                lt:
                  type: string
                is_null:
                  type: boolean
              additionalProperties: false
            finished_at:
              type: object
              properties:
                gte:
                  type: string
                lte:
                  type: string
                gt:
                  type: string
                lt:
                  type: string
                is_null:
                  type: boolean
              additionalProperties: false
            duration_ms:
              type: object
              properties:
                eq:
                  type: integer
                gte:
                  type: integer
                lte:
                  type: integer
                gt:
                  type: integer
                lt:
                  type: integer
                is_null:
                  type: boolean
              additionalProperties: false
            created_at:
              type: object
              properties:
                gte:
                  type: string
                lte:
                  type: string
                gt:
                  type: string
                lt:
                  type: string
              additionalProperties: false
            updated_at:
              type: object
              properties:
                gte:
                  type: string
                lte:
                  type: string
                gt:
                  type: string
                lt:
                  type: string
              additionalProperties: false
