      type: object
      properties:
        success:
          type: boolean
          enum:
            - true
        operation:
          type: string
          enum:
            - search
        items:
          type: array
          items:
            type: object
            properties:
              item:
                type: object
                properties:
                  sid:
                    type: string
                  team_sid:
                    type: string
                  mass_action_sid:
                    type: string
                    description: Parent mass action (ma_ac_…).
                  position:
                    type: integer
                    description: 1-based insertion order, immutable. Position 1 is the canary when the parent runs one.
                  current_step:
                    type: integer
                    description: "1-based ordinal into the parent plan: the step the item is on, and the point a retry resumes from."
                  status:
                    type: string
                    enum:
                      - pending
                      - queued
                      - running
                      - succeeded
                      - failed
                      - skipped
                      - cancelled
                  retry_count:
                    type: integer
                  object_type:
                    type: string
                    nullable: true
                    description: Cursor entity family in kebab route-group spelling, e.g. 'antidetect-browsers'. Starts as the parent's target_entity; null for payload-kind rows and for generative rows that have not minted anything yet.
                  object_sid:
                    type: string
                    nullable: true
                    description: "Cursor sid: the entity the next step acts on. For a generative run this is what the row has created so far."
                  payload:
                    type: object
                    nullable: true
                    additionalProperties: {}
                    description: Opaque per-item dispatch params (target identity + per-target extras) for payload-kind runs; null for object / generative rows.
                  step_log:
                    type: array
                    items:
                      type: object
                      properties:
                        step_id:
                          type: integer
                          description: Ordinal of the parent plan step this entry records (mass_actions.plan.steps[].id).
                        status:
                          type: string
                          enum:
                            - running
                            - deferred
                            - succeeded
                            - failed
                            - skipped
                        started_at:
                          type: string
                          description: ISO 8601 UTC. Committed BEFORE the outbound call (started-marker).
                        finished_at:
                          type: string
                          nullable: true
                          description: Terminal commit of this step; null while running or deferred.
                        duration_ms:
                          type: integer
                          nullable: true
                          description: Wall clock for the step, defer waits included.
                        executor_ref:
                          type: string
                          nullable: true
                          description: "Async steps: sid of the dispatched task. The poll handle for a deferred item; null on sync steps."
                        created_object_type:
                          type: string
                          nullable: true
                          description: "creates-steps: entity family of the object this step minted."
                        created_object_sid:
                          type: string
                          nullable: true
                          description: "creates-steps: sid of the minted object. Survives a later failure, so it is the cleanup surface."
                        credits_charged:
                          type: integer
                          nullable: true
                          description: "Creditable steps: credits actually debited for this step; null otherwise."
                        error_message:
                          type: string
                          nullable: true
                          description: Step-local failure cause. The item-level error_message repeats it behind a 'step {k} {tool}:' prefix.
                      required:
                        - step_id
                        - status
                        - started_at
                        - finished_at
                        - duration_ms
                        - executor_ref
                        - created_object_type
                        - created_object_sid
                        - credits_charged
                        - error_message
                    description: "One entry per plan step of the CURRENT attempt, ≤3. Read the last entry for the failure, the earlier ones for what already completed (fail-forward: their effects stand)."
                  scheduled_at:
                    type: string
                    nullable: true
                    description: '"Not before" moment: pacing chain slot, retry re-plan, or the re-poll horizon of a deferred item.'
                  wait_reason:
                    type: string
                    nullable: true
                    enum:
                      - task_pending
                    description: Why the item is deferred mid-cascade. Null when it is not waiting; a parent-level pause leaves this null.
                  error_message:
                    type: string
                    nullable: true
                    description: "Failure text with a machine-readable prefix: 'step {k} {tool}:', 'insufficient_credits:', or 'item_timeout:' (reaper force-fail, outcome unknown)."
                  started_at:
                    type: string
                    nullable: true
                  finished_at:
                    type: string
                    nullable: true
                  duration_ms:
                    type: integer
                    nullable: true
                  created_at:
                    type: string
                  updated_at:
                    type: string
                required:
                  - sid
                  - team_sid
                  - mass_action_sid
                  - position
                  - current_step
                  - status
                  - retry_count
                  - object_type
                  - object_sid
                  - payload
                  - step_log
                  - scheduled_at
                  - wait_reason
                  - error_message
                  - started_at
                  - finished_at
                  - duration_ms
                  - created_at
                  - updated_at
              included:
                type: object
                additionalProperties: {}
            required:
              - item
              - included
        pagination:
          type: object
          properties:
            next_cursor:
              type: string
              nullable: true
            has_more:
              type: boolean
            total_count:
              type: integer
              nullable: true
          required:
            - next_cursor
            - has_more
            - total_count
        applied_filters:
          type: object
          additionalProperties: {}
        includes:
          type: array
          items:
            type: string
        meta:
          type: object
          properties:
            trace_id:
              type: string
              description: UUID v7; same 128-bit value as the X-Trace-Id header.
            span_id:
              type: string
              pattern: ^[0-9a-f]{16}$
              description: 16 hex chars, root span of this request.
            timestamp:
              type: string
              description: ISO 8601 UTC (Y-m-dTH:i:sZ), response time.
            duration_ms:
              type: integer
              minimum: 0
              description: Server-side wall clock.
            debug_url:
              type: string
              description: Deep link to the post-call analysis UI.
          required:
            - trace_id
            - span_id
            - timestamp
            - duration_ms
            - debug_url
        counts:
          type: object
          additionalProperties: {}
      required:
        - success
        - operation
        - items
        - pagination
        - applied_filters
        - includes
        - meta
