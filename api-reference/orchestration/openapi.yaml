components:
  securitySchemes:
    BearerJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token issued by gtm.service.id. Its `access_identity` claim carries `team_sid`, `actor_sid` and `actor_type`, and that team scope is authoritative.
    TeamSid:
      type: apiKey
      in: header
      name: Team-SID
      description: Team scope for tokens that do not carry one. Ignored when the token already names a team.
  responses:
    McpClientError:
      description: MCP error envelope. `error.code` is one of validation_failed, nothing_to_update, not_found, relation_not_found, invalid_transition, limit_exceeded, payment_required, duplicate_rejected, conflict, delete_blocked, unauthorized, forbidden, rate_limited, not_implemented.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/McpError"
    McpServerError:
      description: MCP error envelope with `error.code` internal_error or service_unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/McpError"
  schemas:
    CancelWebhookLogRequest:
      type: object
      description: Request body of `cancel_webhook_log`.
      properties:
        expected_status:
          type: string
          enum:
            - pending
            - in_progress
            - retrying
            - success
            - failed
            - cancelled
          description: Optional CAS guard; rejected with 409 precondition_failed when current status differs.
    CancelWebhookLogResponse:
      type: object
      properties:
        success:
          type: boolean
          enum:
            - true
        operation:
          type: string
          enum:
            - action
        action:
          type: string
          description: kebab-case verb; matches the route segment.
        item:
          type: object
          nullable: true
          properties:
            sid:
              type: string
            team_sid:
              type: string
            webhook_sid:
              type: string
            account_sid:
              type: string
              nullable: true
            source_service:
              type: string
              nullable: true
            event_type:
              type: string
            event_source_sid:
              type: string
              nullable: true
            status:
              type: string
              enum:
                - pending
                - in_progress
                - retrying
                - success
                - failed
                - cancelled
            retry_count:
              type: number
            cancel_reason:
              type: string
              nullable: true
              enum:
                - manual
                - webhook_deleted
                - webhook_disabled
            request_method:
              type: string
            request_url:
              type: string
            request_headers:
              type: object
              additionalProperties:
                type: string
            request_payload:
              type: object
              additionalProperties: {}
            response_code:
              type: number
              nullable: true
            error_message:
              type: string
              nullable: true
            duration_ms:
              type: number
              nullable: true
            scheduled_at:
              type: string
            executed_at:
              type: string
              nullable: true
            created_at:
              type: string
            updated_at:
              type: string
          required:
            - sid
            - team_sid
            - webhook_sid
            - account_sid
            - source_service
            - event_type
            - event_source_sid
            - status
            - retry_count
            - cancel_reason
            - request_method
            - request_url
            - request_headers
            - request_payload
            - response_code
            - error_message
            - duration_ms
            - scheduled_at
            - executed_at
            - created_at
            - updated_at
        result:
          type: object
          properties:
            previous_status:
              type: string
              enum:
                - pending
                - in_progress
                - retrying
                - success
                - failed
                - cancelled
            cancel_reason:
              type: string
              enum:
                - manual
                - webhook_deleted
                - webhook_disabled
            cancelled_at:
              type: string
            in_flight_attempt_pending:
              type: boolean
          required:
            - previous_status
            - cancel_reason
            - cancelled_at
            - in_flight_attempt_pending
        meta:
          type: object
          properties:
            trace_id:
              type: string
              description: UUID v7; same 128-bit value as the X-Trace-Id header.
            span_id:
              type: string
              pattern: ^[0-9a-f]{16}$
              description: 16 hex chars, root span of this request.
            timestamp:
              type: string
              description: ISO 8601 UTC (Y-m-dTH:i:sZ), response time.
            duration_ms:
              type: integer
              minimum: 0
              description: Server-side wall clock.
            debug_url:
              type: string
              description: Deep link to the post-call analysis UI.
          required:
            - trace_id
            - span_id
            - timestamp
            - duration_ms
            - debug_url
        credits:
          type: object
          properties:
            charged:
              type: integer
              minimum: 0
              description: Credits debited for THIS call (0 on own-account / cache hit).
            reason:
              type: string
              nullable: true
              enum:
                - infra_pool
                - limit_fallback
            executed_on:
              type: string
              enum:
                - own_account
                - infra_pool
            balance_after:
              type: integer
              nullable: true
              minimum: 0
              description: Team balance after the debit; null when the ledger was untouched.
          required:
            - charged
            - reason
            - executed_on
            - balance_after
      required:
        - success
        - operation
        - action
        - item
        - result
        - meta
    CreateMassActionRequest:
      type: object
      description: Request body of `create_mass_action`.
      properties:
        title:
          type: string
          nullable: true
          maxLength: 255
        target_entity:
          type: string
          maxLength: 128
        scope:
          anyOf:
            - type: object
              properties:
                kind:
                  type: string
                  enum:
                    - objects
                object_sids:
                  type: array
                  items:
                    type: string
                    minLength: 18
                    maxLength: 18
                  minItems: 1
                  maxItems: 100
                  description: Existing rows of the target_entity family, 1..100.
              required:
                - kind
                - object_sids
            - type: object
              properties:
                kind:
                  type: string
                  enum:
                    - targets
                targets:
                  type: array
                  items:
                    type: object
                    additionalProperties: {}
                  minItems: 1
                  maxItems: 100
                  description: 1..100 payload-kind identities (send-class); per-item params, shape owned by the target entity.
              required:
                - kind
                - targets
            - type: object
              properties:
                kind:
                  type: string
                  enum:
                    - generate
                count:
                  type: integer
                  minimum: 1
                  maximum: 100
                  description: "N slot items with no pre-existing object; step 1 must be a creates: verb."
              required:
                - kind
                - count
            - type: object
              properties:
                kind:
                  type: string
                  enum:
                    - none
              required:
                - kind
              description: "Empty: a STANDING run at 0 items that an auto-scrape appends into over time."
        plan:
          type: object
          properties:
            steps:
              type: array
              items:
                type: object
                properties:
                  tool:
                    anyOf:
                      - type: string
                        enum:
                          - linkedin-connection-requests.send-linkedin-connection-request
                          - linkedin-posting.react
                          - email-messages.send
                          - antidetect-browsers.run
                          - antidetect-browsers.stop
                          - antidetect-browsers.delete
                          - antidetect-browsers.create
                          - antidetect-browsers.generate-cloud-browser-access-key
                          - antidetect-browsers.revoke-cloud-browser-access-key
                          - linkedin-accounts.update-sync-config
                          - linkedin-account-smart-limits.update
                          - linkedin-account-smart-limits.reset-hold
                      - type: string
                        enum:
                          - linkedin-connection-requests.send
