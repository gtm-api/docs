    PreviewMassActionRequest:
      type: object
      description: Request body of `preview_mass_action`.
      properties:
        title:
          type: string
          nullable: true
          maxLength: 255
          description: Human label for the run, shown in the list view and on the consent surface.
        target_entity:
          type: string
          maxLength: 128
          description: Kebab-plural entity family the plan's steps operate on, e.g. 'linkedin-connection-requests', 'linkedin-posting' or 'email-messages'. The compatibility anchor a linked auto-scrape checks against.
        scope:
          anyOf:
            - type: object
              properties:
                kind:
                  type: string
                  enum:
                    - objects
                object_sids:
                  type: array
                  items:
                    type: string
                    minLength: 18
                    maxLength: 18
                  minItems: 1
                  maxItems: 100
                  description: Existing rows of the target_entity family, 1..100.
              required:
                - kind
                - object_sids
            - type: object
              properties:
                kind:
                  type: string
                  enum:
                    - targets
                targets:
                  type: array
                  items:
                    type: object
                    additionalProperties: {}
                  minItems: 1
                  maxItems: 100
                  description: 1..100 payload-kind identities (send-class); per-item params, shape owned by the target entity.
              required:
                - kind
                - targets
            - type: object
              properties:
                kind:
                  type: string
                  enum:
                    - generate
                count:
                  type: integer
                  minimum: 1
                  maximum: 100
                  description: "N slot items with no pre-existing object; step 1 must be a creates: verb."
              required:
                - kind
                - count
            - type: object
              properties:
                kind:
                  type: string
                  enum:
                    - none
              required:
                - kind
              description: "Empty: a STANDING run at 0 items that an auto-scrape appends into over time."
          description: "What the run enrols: existing rows (objects), payload identities (targets), generated slots (generate), or nothing yet (none, a standing run an auto-scrape feeds)."
        plan:
          type: object
          properties:
            steps:
              type: array
              items:
                type: object
                properties:
                  tool:
                    anyOf:
                      - type: string
                        enum:
                          - linkedin-connection-requests.send-linkedin-connection-request
                          - linkedin-posting.react
                          - email-messages.send
                          - antidetect-browsers.run
                          - antidetect-browsers.stop
                          - antidetect-browsers.delete
                          - antidetect-browsers.create
                          - antidetect-browsers.generate-cloud-browser-access-key
                          - antidetect-browsers.revoke-cloud-browser-access-key
                          - linkedin-accounts.update-sync-config
                          - linkedin-account-smart-limits.update
                          - linkedin-account-smart-limits.reset-hold
                      - type: string
                        enum:
                          - linkedin-connection-requests.send
                    description: Dotted verb '{entity-kebab-plural}.{verb}'. Only these are step-eligible today; anything else fails preview with 422 not_step_eligible on field plan.steps.{i}.tool. 'linkedin-connection-requests.send' is a legacy alias of the send-linkedin-connection-request case, accepted but not the spelling to author.
                  args:
                    type: object
                    additionalProperties: {}
                    description: "The verb's own arguments, EXCLUDING the target: the target is injected per item from the object cursor or the item payload. Shared across every item of the run."
                required:
                  - tool
              minItems: 1
              maxItems: 3
              description: 1..3 steps, run in order per item. Step ids are server-assigned 1-based ordinals; do not send them. Longer intents split into sequential mass-actions.
          required:
            - steps
        schedule:
          type: object
          nullable: true
          properties:
            interval_seconds_min:
              type: integer
              minimum: 30
              maximum: 86400
            interval_seconds_max:
              type: integer
              minimum: 30
              maximum: 86400
              description: ">= interval_seconds_min."
          required:
            - interval_seconds_min
            - interval_seconds_max
          description: Omit for an ASAP drain. Required when the plan carries a send-class step, else 422 schedule_required.
        canary_mode:
          type: string
          enum:
            - none
            - first_item
          description: "Default 'first_item': only item 1 dispatches until it succeeds, so a wrong plan burns one target instead of all of them."
      required:
        - target_entity
        - scope
        - plan
