    CreateAccountShareRequest:
      type: object
      description: Request body of `create_account_share`.
      properties:
        channel:
          type: string
          enum:
            - linkedin
            - email
          description: Which channel service owns the account you are lending.
        account_sid:
          type: string
          minLength: 18
          maxLength: 18
          description: "The owned account to lend. Length checked only, never prefix checked: the same field names a LinkedIn account (ln_ac_), an email account (em_ac_) or a future channel's sender, and `channel` is what says which."
        to_email:
          type: string
          maxLength: 255
          format: email
          description: "Default targeting: the holder team is that user's working team. Exactly one of to_email or to_team_sid."
        to_team_sid:
          type: string
          minLength: 18
          maxLength: 18
          pattern: ^ts_tm_
          description: Direct targeting. Exactly one of to_email or to_team_sid; it must not be your own team.
        planned_return_at:
          type: string
          nullable: true
          description: "ISO 8601 UTC. Informational only: it drives one owner reminder email with a recall link. There is NO auto return."
      required:
        - channel
        - account_sid
    CreateAccountShareResponse:
      type: object
      properties:
        success:
          type: boolean
          enum:
            - true
        operation:
          type: string
          enum:
            - create
        item:
          type: object
          properties:
            sid:
              type: string
            team_sid:
              type: string
              description: "The OWNER team: the row tenant, the side that lent the account out."
            channel:
              type: string
              enum:
                - linkedin
                - email
              description: Which channel service owns the physical account pair.
            to_team_sid:
              type: string
              description: "The HOLDER team: the side that borrowed the account."
            to_user_sid:
              type: string
              nullable: true
              description: Resolved user when the share was targeted by email; null when targeted by team sid.
            to_email:
              type: string
              nullable: true
              description: The targeting input kept for audit; null when targeted by team sid.
            owner_cluster_id:
              type: integer
            holder_cluster_id:
              type: integer
            owner_account_sid:
              type: string
              description: "The owner's channel account row, parked for the duration of the loan. Prefix agnostic: ln_ac_ on LinkedIn, em_ac_ on email."
            owner_channel_ref:
              type: string
              nullable: true
              description: Opaque second row the channel needs to name (LinkedIn puts its ab_br_ browser sid here); null when the channel needs none.
            holder_account_sid:
              type: string
              nullable: true
              description: The holder's copy. NULL until the copy phase lands, so it is null on every pre-active row.
            holder_channel_ref:
              type: string
              nullable: true
            status:
              type: string
              enum:
                - pending
                - owner_parked
                - active
                - closing
                - holder_released
                - rolling_back
                - returned
                - recalled
                - failed
              description: The durable phase, and the answer to "did the loan start". Only active means the holder can work.
            holder_over_slot:
              type: boolean
              description: True when the holder had no free account slot at create, so the copy landed in the channel's subscription hold. The loan still reaches active; the holder cannot work until it upgrades.
            end_reason:
              type: string
              nullable: true
              enum:
                - returned_by_holder
                - recalled_by_owner
                - holder_deleted_copy
                - holder_team_purged
                - owner_team_purged
              description: Stamped when an ending is REQUESTED. Only ever set on a row that reached active.
            failure_reason:
              type: string
              nullable: true
              enum:
                - park_failed
                - export_failed
                - copy_refused
                - probe_stale
                - team_purged
              description: Why a pre-active phase gave up. Non null on exactly rolling_back and failed.
            planned_return_at:
              type: string
              nullable: true
              description: Informational only. When it passes the owner is emailed a recall link once; there is NO auto return.
            expiry_notified_at:
              type: string
              nullable: true
            phase_claimed_at:
              type: string
              nullable: true
            phase_attempts:
              type: integer
              description: Attempts on the CURRENT phase, reset on every advance. A large and growing value is the stuck signal on a phase that may not give up.
            ended_at:
              type: string
              nullable: true
            ended_by:
              type: object
              nullable: true
              properties:
                actor_type:
                  type: string
                  enum:
                    - user
                    - support
                    - api_key
                    - system
                    - agent
                actor_sid:
                  type: string
                  nullable: true
                team_sid:
                  type: string
                permissions:
                  type: object
                  additionalProperties: {}
                request_sid:
                  type: string
                  nullable: true
                reason:
                  type: string
                  nullable: true
              required:
                - actor_type
                - actor_sid
                - team_sid
                - permissions
              description: Who ended it. The machine readable why is end_reason (an ending) or failure_reason (a failure), never this blob.
            created_by:
              type: object
              nullable: true
              properties:
                actor_type:
                  type: string
                  enum:
                    - user
                    - support
                    - api_key
                    - system
                    - agent
                actor_sid:
                  type: string
                  nullable: true
                team_sid:
                  type: string
                permissions:
                  type: object
                  additionalProperties: {}
                request_sid:
                  type: string
                  nullable: true
                reason:
                  type: string
                  nullable: true
              required:
                - actor_type
                - actor_sid
                - team_sid
                - permissions
            created_at:
              type: string
            updated_at:
              type: string
          required:
            - sid
            - team_sid
            - channel
            - to_team_sid
            - to_user_sid
            - to_email
            - owner_cluster_id
            - holder_cluster_id
            - owner_account_sid
            - owner_channel_ref
            - holder_account_sid
            - holder_channel_ref
            - status
            - holder_over_slot
            - end_reason
            - failure_reason
            - planned_return_at
            - expiry_notified_at
            - phase_claimed_at
            - phase_attempts
            - ended_at
            - ended_by
            - created_by
            - created_at
            - updated_at
