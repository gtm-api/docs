                    type: string
                    enum:
                      - linkedin
                      - email
              additionalProperties: false
              description: '"My LinkedIn loans" vs "my email loans".'
            status:
              type: object
              properties:
                eq:
                  type: string
                  enum:
                    - pending
                    - owner_parked
                    - active
                    - closing
                    - holder_released
                    - rolling_back
                    - returned
                    - recalled
                    - failed
                ne:
                  type: string
                  enum:
                    - pending
                    - owner_parked
                    - active
                    - closing
                    - holder_released
                    - rolling_back
                    - returned
                    - recalled
                    - failed
                in:
                  type: array
                  items:
