                    enum:
                      - pending
                      - owner_parked
                      - active
                      - closing
                      - holder_released
                      - rolling_back
                      - returned
                      - recalled
                      - failed
                nin:
                  type: array
                  items:
                    type: string
                    enum:
                      - pending
                      - owner_parked
                      - active
                      - closing
                      - holder_released
                      - rolling_back
                      - returned
                      - recalled
                      - failed
              additionalProperties: false
              description: 'The phase. { eq: "active" } is the live set; { in: ["rolling_back","failed"] } is the loans that gave up.'
            to_team_sid:
              type: object
              properties:
                eq:
                  type: string
                in:
                  type: array
                  items:
                    type: string
              additionalProperties: false
              description: "Owner side question: everything lent to team X."
            to_user_sid:
              type: object
              properties:
                eq:
                  type: string
                in:
                  type: array
                  items:
                    type: string
              additionalProperties: false
            owner_account_sid:
              type: object
              properties:
                eq:
                  type: string
                in:
                  type: array
                  items:
                    type: string
              additionalProperties: false
              description: 'Share history of an owned account: "is this account lent out, and to whom".'
            holder_account_sid:
              type: object
              properties:
                eq:
                  type: string
                in:
                  type: array
                  items:
                    type: string
              additionalProperties: false
              description: "Holder side question: map a borrowed copy back to its loan."
            holder_over_slot:
              type: object
              properties:
                eq:
                  type: boolean
              additionalProperties: false
              description: Which loans reached active but landed with no free slot on the holder side.
            end_reason:
              type: object
              properties:
                eq:
                  type: string
                  enum:
                    - returned_by_holder
                    - recalled_by_owner
                    - holder_deleted_copy
                    - holder_team_purged
                    - owner_team_purged
                in:
                  type: array
                  items:
                    type: string
                    enum:
                      - returned_by_holder
                      - recalled_by_owner
                      - holder_deleted_copy
                      - holder_team_purged
                      - owner_team_purged
                is_null:
                  type: boolean
              additionalProperties: false
            failure_reason:
              type: object
              properties:
                eq:
                  type: string
                  enum:
                    - park_failed
                    - export_failed
                    - copy_refused
                    - probe_stale
                    - team_purged
                in:
                  type: array
                  items:
                    type: string
                    enum:
                      - park_failed
                      - export_failed
                      - copy_refused
                      - probe_stale
                      - team_purged
                is_null:
                  type: boolean
              additionalProperties: false
            owner_cluster_id:
              type: object
              properties:
                eq:
                  type: integer
                in:
                  type: array
                  items:
                    type: integer
              additionalProperties: false
            holder_cluster_id:
              type: object
              properties:
                eq:
                  type: integer
                in:
                  type: array
                  items:
                    type: integer
              additionalProperties: false
            phase_claimed_at:
              type: object
              properties:
                gte:
                  type: string
                lte:
                  type: string
                is_null:
                  type: boolean
              additionalProperties: false
            planned_return_at:
              type: object
              properties:
                gte:
                  type: string
                lte:
                  type: string
                gt:
                  type: string
                lt:
                  type: string
                is_null:
                  type: boolean
              additionalProperties: false
              description: "{ is_null: true } is an open ended lend."
            created_at:
              type: object
              properties:
                gte:
                  type: string
                lte:
                  type: string
                gt:
                  type: string
                lt:
                  type: string
              additionalProperties: false
        sort:
          type: object
          properties:
            field:
              type: string
              enum:
                - created_at
