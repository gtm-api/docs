    RecallAccountShareRequest:
      type: object
      description: Request body of `recall_account_share`.
      properties:
        sid:
          type: string
          minLength: 18
          maxLength: 18
          pattern: ^ac_sh_
          description: Single-share mode. Mutually exclusive with filter.
        filter:
          type: object
          properties:
            sid:
              type: object
              properties:
                eq:
                  type: string
                in:
                  type: array
                  items:
                    type: string
              additionalProperties: false
            channel:
              type: object
              properties:
                eq:
                  type: string
                  enum:
                    - linkedin
                    - email
                in:
                  type: array
                  items:
                    type: string
                    enum:
                      - linkedin
                      - email
              additionalProperties: false
              description: '"My LinkedIn loans" vs "my email loans".'
            status:
              type: object
              properties:
                eq:
                  type: string
                  enum:
                    - pending
                    - owner_parked
                    - active
                    - closing
                    - holder_released
                    - rolling_back
                    - returned
                    - recalled
                    - failed
                ne:
                  type: string
                  enum:
                    - pending
                    - owner_parked
                    - active
                    - closing
                    - holder_released
                    - rolling_back
                    - returned
                    - recalled
                    - failed
                in:
                  type: array
                  items:
                    type: string
                    enum:
                      - pending
                      - owner_parked
                      - active
                      - closing
                      - holder_released
                      - rolling_back
                      - returned
                      - recalled
                      - failed
                nin:
                  type: array
                  items:
                    type: string
                    enum:
                      - pending
                      - owner_parked
                      - active
                      - closing
                      - holder_released
                      - rolling_back
                      - returned
                      - recalled
                      - failed
              additionalProperties: false
              description: 'The phase. { eq: "active" } is the live set; { in: ["rolling_back","failed"] } is the loans that gave up.'
            to_team_sid:
              type: object
              properties:
                eq:
                  type: string
                in:
                  type: array
                  items:
                    type: string
              additionalProperties: false
              description: "Owner side question: everything lent to team X."
            to_user_sid:
              type: object
              properties:
                eq:
                  type: string
                in:
                  type: array
                  items:
                    type: string
              additionalProperties: false
            owner_account_sid:
              type: object
              properties:
                eq:
                  type: string
                in:
                  type: array
                  items:
                    type: string
              additionalProperties: false
              description: 'Share history of an owned account: "is this account lent out, and to whom".'
            holder_account_sid:
              type: object
              properties:
                eq:
                  type: string
                in:
                  type: array
                  items:
                    type: string
              additionalProperties: false
              description: "Holder side question: map a borrowed copy back to its loan."
            holder_over_slot:
              type: object
              properties:
                eq:
                  type: boolean
              additionalProperties: false
              description: Which loans reached active but landed with no free slot on the holder side.
            end_reason:
              type: object
              properties:
                eq:
                  type: string
                  enum:
                    - returned_by_holder
                    - recalled_by_owner
                    - holder_deleted_copy
                    - holder_team_purged
                    - owner_team_purged
                in:
                  type: array
                  items:
                    type: string
                    enum:
                      - returned_by_holder
                      - recalled_by_owner
                      - holder_deleted_copy
                      - holder_team_purged
                      - owner_team_purged
                is_null:
                  type: boolean
              additionalProperties: false
            failure_reason:
              type: object
              properties:
                eq:
                  type: string
                  enum:
                    - park_failed
                    - export_failed
                    - copy_refused
                    - probe_stale
                    - team_purged
                in:
                  type: array
                  items:
                    type: string
                    enum:
                      - park_failed
                      - export_failed
                      - copy_refused
                      - probe_stale
                      - team_purged
                is_null:
                  type: boolean
              additionalProperties: false
            owner_cluster_id:
              type: object
              properties:
                eq:
                  type: integer
                in:
                  type: array
                  items:
                    type: integer
              additionalProperties: false
            holder_cluster_id:
              type: object
              properties:
                eq:
                  type: integer
                in:
                  type: array
                  items:
                    type: integer
              additionalProperties: false
            phase_claimed_at:
              type: object
              properties:
                gte:
                  type: string
                lte:
                  type: string
                is_null:
                  type: boolean
              additionalProperties: false
            planned_return_at:
              type: object
              properties:
                gte:
                  type: string
                lte:
                  type: string
                gt:
                  type: string
                lt:
                  type: string
                is_null:
                  type: boolean
              additionalProperties: false
              description: "{ is_null: true } is an open ended lend."
            created_at:
              type: object
              properties:
                gte:
                  type: string
                lte:
                  type: string
                gt:
                  type: string
                lt:
                  type: string
              additionalProperties: false
          description: Mass-target mode, resolved against the loans you ISSUED. status is overwritten with eq active server side, so it cannot be widened. Mutually exclusive with sid.
        confirmation_count:
          type: integer
          minimum: 0
          description: Blast-radius confirmation, REQUIRED with filter and ignored with sid. Must equal the active-pinned pagination.total_count of the same filter from search_account_shares; a mismatch is 409, not a partial run.
    RecallAccountShareResponse:
      type: object
      properties:
        success:
          type: boolean
          enum:
            - true
        operation:
          type: string
          enum:
            - action
        action:
          type: string
          description: kebab-case verb; matches the route segment.
        item:
          type: object
          nullable: true
          properties:
            sid:
              type: string
            team_sid:
              type: string
              description: "The OWNER team: the row tenant, the side that lent the account out."
            channel:
              type: string
              enum:
                - linkedin
                - email
              description: Which channel service owns the physical account pair.
            to_team_sid:
              type: string
              description: "The HOLDER team: the side that borrowed the account."
            to_user_sid:
              type: string
              nullable: true
              description: Resolved user when the share was targeted by email; null when targeted by team sid.
            to_email:
              type: string
              nullable: true
              description: The targeting input kept for audit; null when targeted by team sid.
            owner_cluster_id:
              type: integer
            holder_cluster_id:
              type: integer
            owner_account_sid:
              type: string
              description: "The owner's channel account row, parked for the duration of the loan. Prefix agnostic: ln_ac_ on LinkedIn, em_ac_ on email."
            owner_channel_ref:
              type: string
              nullable: true
              description: Opaque second row the channel needs to name (LinkedIn puts its ab_br_ browser sid here); null when the channel needs none.
            holder_account_sid:
              type: string
              nullable: true
              description: The holder's copy. NULL until the copy phase lands, so it is null on every pre-active row.
            holder_channel_ref:
              type: string
              nullable: true
            status:
              type: string
              enum:
                - pending
                - owner_parked
                - active
                - closing
                - holder_released
                - rolling_back
                - returned
                - recalled
                - failed
              description: The durable phase, and the answer to "did the loan start". Only active means the holder can work.
            holder_over_slot:
              type: boolean
              description: True when the holder had no free account slot at create, so the copy landed in the channel's subscription hold. The loan still reaches active; the holder cannot work until it upgrades.
            end_reason:
              type: string
              nullable: true
              enum:
                - returned_by_holder
                - recalled_by_owner
                - holder_deleted_copy
                - holder_team_purged
                - owner_team_purged
              description: Stamped when an ending is REQUESTED. Only ever set on a row that reached active.
            failure_reason:
              type: string
              nullable: true
              enum:
                - park_failed
                - export_failed
                - copy_refused
                - probe_stale
                - team_purged
              description: Why a pre-active phase gave up. Non null on exactly rolling_back and failed.
            planned_return_at:
              type: string
              nullable: true
              description: Informational only. When it passes the owner is emailed a recall link once; there is NO auto return.
            expiry_notified_at:
              type: string
              nullable: true
            phase_claimed_at:
              type: string
              nullable: true
            phase_attempts:
              type: integer
              description: Attempts on the CURRENT phase, reset on every advance. A large and growing value is the stuck signal on a phase that may not give up.
            ended_at:
              type: string
              nullable: true
            ended_by:
              type: object
              nullable: true
              properties:
                actor_type:
                  type: string
                  enum:
                    - user
                    - support
                    - api_key
                    - system
                    - agent
                actor_sid:
                  type: string
                  nullable: true
                team_sid:
                  type: string
                permissions:
                  type: object
                  additionalProperties: {}
                request_sid:
                  type: string
                  nullable: true
                reason:
                  type: string
                  nullable: true
              required:
                - actor_type
                - actor_sid
                - team_sid
                - permissions
              description: Who ended it. The machine readable why is end_reason (an ending) or failure_reason (a failure), never this blob.
            created_by:
              type: object
              nullable: true
              properties:
                actor_type:
                  type: string
                  enum:
                    - user
                    - support
                    - api_key
                    - system
                    - agent
                actor_sid:
                  type: string
                  nullable: true
                team_sid:
                  type: string
                permissions:
                  type: object
                  additionalProperties: {}
                request_sid:
                  type: string
                  nullable: true
                reason:
                  type: string
                  nullable: true
              required:
                - actor_type
                - actor_sid
                - team_sid
                - permissions
            created_at:
              type: string
            updated_at:
              type: string
          required:
            - sid
            - team_sid
            - channel
            - to_team_sid
            - to_user_sid
            - to_email
            - owner_cluster_id
            - holder_cluster_id
            - owner_account_sid
            - owner_channel_ref
            - holder_account_sid
            - holder_channel_ref
            - status
            - holder_over_slot
            - end_reason
            - failure_reason
            - planned_return_at
            - expiry_notified_at
            - phase_claimed_at
            - phase_attempts
            - ended_at
            - ended_by
            - created_by
            - created_at
            - updated_at
        result:
          type: object
          properties:
            closing_count:
              type: integer
              minimum: 0
              description: Shares this call stamped closing. The teardown is the driver's, so this is never "recalled" or "returned".
            total_matched:
